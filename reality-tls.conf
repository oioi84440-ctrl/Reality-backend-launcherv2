# Reality Client backend — TLS reverse proxy (F01)
# Hostname: 16-5-7-132.sslip.io — DNS wildcard publico que resolve para 16.5.7.132.
# Certificado Let's Encrypt: /etc/letsencrypt/live/16-5-7-132.sslip.io/
# HTTP (porta 80) redireciona para HTTPS. A porta 3000 continua em HTTP puro
# para o launcher antigo (compat durante a transicao) — ela NAO passa por aqui.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 16-5-7-132.sslip.io;

    # ACME challenge servido pelo certbot (nao redireciona)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 16-5-7-132.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/16-5-7-132.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16-5-7-132.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;
    proxy_hide_header X-Powered-By;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # SEGURANCA: SOBRESCREVE (nao anexa) o X-Forwarded-For com o IP real da
        # conexao TLS. O backend so confia nesse header quando a conexao vem do
        # loopback (nginx) — entao o cliente nao consegue forjar o proprio IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
