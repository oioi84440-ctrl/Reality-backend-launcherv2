# Fase A (HTTP apenas) — bootstrap do certificado Let's Encrypt.
# Depois do certbot, este arquivo vira reality-tls.conf (com 443 + redirect).
server {
    listen 80;
    listen [::]:80;
    server_name 16-5-7-132.sslip.io 16.5.7.132.sslip.io 16-5-7-132.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
